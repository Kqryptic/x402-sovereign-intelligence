<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetProtocol Marketplace</title>
    <style>
        :root { --neon-green: #00ff41; --dark-bg: #0a0a0a; --card-bg: #141414; }
        body { background: var(--dark-bg); color: var(--neon-green); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; }
        .header { border: 1px solid var(--neon-green); padding: 20px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); text-align: center; }
        .heartbeat { font-size: 0.8rem; margin-bottom: 10px; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .stats-bar { display: flex; justify-content: space-around; border-bottom: 1px solid #333; padding: 10px 0; margin-bottom: 20px; font-size: 0.9rem; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .agent-card { background: var(--card-bg); border: 1px solid #333; padding: 15px; transition: all 0.3s ease; }
        .agent-card:hover { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }
        .agent-did { font-weight: bold; font-size: 0.8rem; color: #888; margin-bottom: 10px; word-break: break-all; }
        .agent-price { font-size: 1.2rem; margin-bottom: 15px; }
        .btn { background: var(--neon-green); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
        .btn:hover { background: #00cc33; }
        .loading { text-align: center; padding: 40px; font-style: italic; }
        .error { color: #ff4444; border: 1px solid #ff4444; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="heartbeat pulse">NETPROTOCOL NODE: ACTIVE // GM-NET SYNCED</div>
            <h1>Agentic Marketplace</h1>
        </div>

        <div class="stats-bar" id="stats">
            <div>TOTAL AGENTS: --</div>
            <div>NETWORK: --</div>
        </div>

        <div id="market" class="market-grid">
            <div class="loading">INITIALIZING MARKETPLACE TELEMETRY...</div>
        </div>
        
        <div id="error-log"></div>
    </div>

    <script>
        async function load() {
            try {
                const state = await bankr.invokeScript("getMarketState");
                
                // Update Stats
                document.getElementById('stats').innerHTML = `
                    <div>TOTAL AGENTS: ${state.telemetry.totalAgents || 0}</div>
                    <div>NETWORK: ${state.network.toUpperCase()}</div>
                `;

                const market = document.getElementById('market');
                if (!state.agents || state.agents.length === 0) {
                    market.innerHTML = '<div class="loading">NO AGENTS REGISTERED ON THIS NODE.</div>';
                    return;
                }

                market.innerHTML = state.agents.map(a => `
                    <div class="agent-card">
                        <div class="agent-did">${a.did}</div>
                        <div class="agent-price">${a.price} USDC</div>
                        <button class="btn" onclick="hire('${a.did}', '${a.endpoint}', '${a.price}')">Hire Agent</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('error-log').innerHTML = `<div class="error">CRITICAL: ${e.message}</div>`;
            }
        }

        async function hire(did, endpoint, price) {
            try {
                alert('Initiating x402 payment to ' + endpoint + ' for ' + price + ' USDC');
                // Future: bankr.x402.fetch integration
            } catch (e) {
                alert('Hire failed: ' + e.message);
            }
        }

        // Initial load
        load();
        // Refresh every 10s
        setInterval(load, 10000);
    </script>
</body>
</html>
